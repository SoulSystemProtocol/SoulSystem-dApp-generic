name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, build, and test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_ALCHEMY_KEY: ci-placeholder
      NEXT_PUBLIC_WALLETCONNECT_PROJECTID: ci-placeholder
      NEXT_PUBLIC_NETWORK_CHAIN_ID: "1313161554"
      NEXT_PUBLIC_NETWORK_CHAIN_ID_HEX: "0x4e454152"
      NEXT_PUBLIC_NETWORK_NAME: Aurora
      NEXT_PUBLIC_INDEXER_GRAPHQL_URL: https://app.sentio.xyz//api/v1/graphql/toledoroy/soulsystem-aurora
      NEXT_PUBLIC_SUBGRAPH_API: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci --runInBand

  indexer:
    name: Indexer codegen and typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: indexer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-indexer-${{ hashFiles('indexer/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-indexer-

      - name: Install indexer dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen
        run: pnpm codegen

      - name: Typecheck
        run: pnpm typecheck
